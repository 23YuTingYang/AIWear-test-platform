[pytest]
;--alluredir=report/allure-results --clean-alluredir
;allure generate report/allure-results -o report/allure-report --clean  生成测试报告html
;allure serve report/allure-results

addopts = -vs --alluredir=report/allure-results --clean-alluredir
testpaths = testcases
python_files = test_*.py
python_classes = Test*
python_functions = test_*
;addopts = -ra
markers =
    order: 用 pytest-order 控制执行顺序
    smoke: 核心主流程用例
    manual: 依赖人工或外部验证码的用例
    unstable: 依赖后端异常场景的用例
